version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_CERTIFICATE: "path/to/certificate.pfx"
  # SIGN_THUMBPRINT: "certificate-thumbprint"  # Alternative to SIGN_CERTIFICATE
  # TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      # Default to CGO_ENABLED=0 if not explicitly set
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l" -ldflags="-H windowsgui"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X lingzhu-app/internal/version.Version={{.VERSION}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application
    desc: |
      Defaults to a per-user install so the app can write settings without
      elevation. Pass INSTALL_SCOPE=machine for a machine-wide install.
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  stage:core:
    summary: Stages the core beside the app binary
    desc: |
      Copies the built core to bin/lingzhu.exe so the packaging scripts can
      include it. NSIS cannot expand ".." in a File directive, and a release
      install keeps both binaries together. This never rebuilds anything, so a
      core signed in place at bin/lingzhu.exe keeps its signature as long as the
      task is not rerun after signing.
    cmds:
      - cmd: powershell -NoProfile -Command "Copy-Item -Force '{{.ROOT_DIR}}/{{.CORE_BIN}}' '{{.ROOT_DIR}}/{{.BIN_DIR}}/lingzhu.exe'"
        platforms: [windows]
      - cmd: cp "{{.ROOT_DIR}}/{{.CORE_BIN}}" "{{.ROOT_DIR}}/{{.BIN_DIR}}/lingzhu.exe"
        platforms: [linux, darwin]

  create:nsis:installer:
    summary: Creates an NSIS installer
    desc: |
      Installs the app and the core sidecar into one directory, so the app finds
      the core beside itself without any environment variable. The installer
      defaults to a per-user install because a machine-wide install directory is
      not writable by the app's settings page.

      Builds the binaries first, then packs them. Use `create:nsis:pack` when
      the binaries are already built and signed.
    dir: build/windows/nsis
    cmds:
      - task: build
      - task: common:build:core
      - task: stage:core
      - task: create:nsis:pack
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE}}'

  create:nsis:pack:
    summary: Packs the already built binaries into an NSIS installer
    desc: |
      Does not build or overwrite the binaries, so a signed executable stays
      signed. The core must already be staged at bin/lingzhu.exe.
    dir: build/windows/nsis
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/lingzhu.exe"'
        msg: "stage the core at bin/lingzhu.exe first (task common:build:core)"
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" -DARG_WAILS_CORE_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\lingzhu.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" -DARG_WAILS_CORE_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/lingzhu.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'

  create:msix:package:
    summary: Creates an MSIX package that ships the app and its core sidecar
    desc: |
      Builds the binaries first, then packs them. Use `create:msix:pack` when
      the binaries are already built and signed.
    cmds:
      - task: build
      - task: common:build:core
      - task: stage:core
      - task: create:msix:pack

  create:msix:pack:
    summary: Packs the already built binaries into an MSIX package
    desc: |
      Does not build or overwrite the binaries, so a signed executable stays
      signed. The core must already be staged at bin/lingzhu.exe.
    preconditions:
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/lingzhu.exe"'
        msg: "stage the core at bin/lingzhu.exe first (task common:build:core)"
    cmds:
      - >-
        go run ./tools/msix
        --config "{{.ROOT_DIR}}/build/config.yml"
        --app "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        --core "{{.ROOT_DIR}}/{{.BIN_DIR}}/lingzhu.exe"
        --arch "{{.ARCH}}"
        --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix"
        {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:app:
    summary: Signs the app executable that is already built
    desc: |
      Signs bin/<app>.exe in place. It never rebuilds, so a signed binary keeps
      its signature; build first with `task build`.
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      # Certificate vars are optional: if unset, `wails3 tool sign` falls back to
      # the certificate configured globally via `wails3 setup`.
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}} {{if .SIGN_CERTIFICATE_PASSWORD}}--password "{{.SIGN_CERTIFICATE_PASSWORD}}"{{end}}

  sign:
    summary: Builds and signs the Windows executable
    desc: |
      Builds the app, then signs bin/<app>.exe with an Authenticode certificate.
      Set SIGN_CERTIFICATE or SIGN_THUMBPRINT to override the certificate
      configured globally via `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: build
    cmds:
      - task: sign:app
  sign:core:
    summary: Signs the staged core sidecar
    desc: |
      Signs bin/lingzhu.exe in place with the same certificate as the app, so
      both binaries inside the installer carry a signature. Stage it first with
      `task windows:stage:core`; this never rebuilds.
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/lingzhu.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}} {{if .SIGN_CERTIFICATE_PASSWORD}}--password "{{.SIGN_CERTIFICATE_PASSWORD}}"{{end}}

  package:signed:
    summary: Builds, signs both executables, then packs and signs the installers
    desc: |
      Release path, in strict order: build the app and its core once, stage the
      core beside the app, sign both executables, pack the per-user NSIS
      installer and the MSIX from the signed binaries, then sign both packages.
      The pack and sign tasks never rebuild, so nothing overwrites a signature.
      Steps run in cmds rather than deps because go-task runs deps concurrently.
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'
    cmds:
      - task: build
      - task: common:build:core
      - task: stage:core
      - task: sign:app
      - task: sign:core
      - task: create:nsis:pack
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE}}'
      - task: create:msix:pack
      - task: sign:installer
      - task: sign:msix

  sign:installer:
    summary: Signs the NSIS installer
    desc: |
      Signs the NSIS installer already written to bin/. Pack it first with
      `create:nsis:pack`; this task never rebuilds or repacks.
      Set SIGN_CERTIFICATE or SIGN_THUMBPRINT to override the certificate
      configured globally via `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'
    preconditions:
      - sh: 'test -f "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}-installer.exe"'
        msg: "build the installer first: task windows:create:nsis:pack"
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}-installer.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}} {{if .SIGN_CERTIFICATE_PASSWORD}}--password "{{.SIGN_CERTIFICATE_PASSWORD}}"{{end}}

  sign:msix:
    summary: Signs the MSIX package
    desc: |
      Signs an existing MSIX package with an Authenticode certificate.
      Set SIGN_CERTIFICATE or SIGN_THUMBPRINT to override the certificate
      configured globally via `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
    preconditions:
      - sh: 'test -f "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix"'
        msg: "build the MSIX first: task windows:create:msix:pack"
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}} {{if .SIGN_CERTIFICATE_PASSWORD}}--password "{{.SIGN_CERTIFICATE_PASSWORD}}"{{end}}
