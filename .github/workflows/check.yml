name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Go sources
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

  tidy:
    name: modules are tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy -diff

  version:
    name: packaging metadata matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lingzhu-app
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lingzhu
          path: lingzhu
      - uses: actions/setup-go@v5
        with:
          go-version-file: lingzhu-app/go.mod
          cache: true
      - name: Sync then verify
        working-directory: lingzhu-app
        run: |
          version="$(tr -d '[:space:]' < ../lingzhu/VERSION)"
          go run ./tools/syncversion -version "$version"
          git diff --exit-code -- build/config.yml build/windows/info.json build/darwin/Info.plist build/linux/nfpm/nfpm.yaml
